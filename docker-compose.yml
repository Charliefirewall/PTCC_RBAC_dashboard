# Local / single-host deployment.
#
#   docker compose up -d --build     →  http://localhost:8080
#
# The first build downloads the ~21 MB map asset pack; later builds reuse that layer.

services:
  ptcc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ptcc-dashboard:latest
    container_name: ptcc-dashboard
    ports:
      - "${PTCC_PORT:-8080}:8080"
    restart: unless-stopped

    # Nothing is written at runtime — the whole app is static files. Locking the
    # filesystem down costs nothing and removes a class of problem outright.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # A static site does not need much. Raise only if you put a CDN-sized load on it.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
