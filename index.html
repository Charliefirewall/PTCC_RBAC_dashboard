      Icon sprite (plan §13.6). Inline so it costs zero requests and is available before
      the first paint. Every symbol is a 24x24 line drawing with NO stroke, fill or colour
      of its own: <Icon> sets fill=none, stroke=currentColor and the stroke width once, and
      those inherit into the <use> shadow content. That is what makes the set themeable and
      keeps the stroke weight identical across the whole set - which glyphs could not do.

      Consumed via `<Icon name="..." />` from src/components/Icon.tsx; the IconName union
      there is the list of ids below, minus the `i-` prefix.
    -->
