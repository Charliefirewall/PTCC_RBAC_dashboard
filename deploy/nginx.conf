# PTCC — static serving config for the production image.
#
# The application is a single-page app with hash routing (#/command, #/map, …), so every
# real URL resolves to index.html. The interesting parts of this file are the map asset
# handling — vector tiles are stored DECOMPRESSED on disk on purpose — and the fact that
# security headers are included per-location rather than declared once (see
# security-headers.conf for why).

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens off;

    # ── compression ───────────────────────────────────────────────────────────────
    # Compressing on the fly is correct and safe: nginx sets Content-Encoding itself, so
    # the browser decompresses transparently. What is NOT safe is storing a pre-gzipped
    # .pbf on disk and serving it without that header — MapLibre then reads gzip bytes as
    # protobuf and the map renders empty, with no error anywhere. See tools/fetch-tiles.mjs.
    # `gzip_static` is therefore deliberately left off.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        application/x-protobuf
        image/svg+xml;

    # ── health ────────────────────────────────────────────────────────────────────
    # Container orchestrators read this; it never touches the app. Everything is served
    # from disk, so there is no upstream whose absence could make a 200 a lie.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── map assets ────────────────────────────────────────────────────────────────
    # Vector tiles and glyph PBFs. The MIME type matters to caches and proxies; the
    # explicit empty Content-Encoding documents that these bytes are already plain.
    location ~* \.pbf$ {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/x-protobuf;
        add_header Content-Encoding "" always;
        add_header Cache-Control "public, max-age=604800" always;   # 7 days
        access_log off;
    }

    # Sprite sheet and the rewritten style JSON: rebuilt with the image, not hashed.
    location ~* ^/(sprite|styles)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;   # 7 days
        access_log off;
    }

    # ── application bundle ────────────────────────────────────────────────────────
    # Vite emits content-hashed filenames here, so these are safe to pin forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── SPA entry ─────────────────────────────────────────────────────────────────
    # index.html must never be cached: it is the only file that names the current bundle
    # hashes, and a stale copy pins a client to a deployment that no longer exists.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
