# Common response headers.
#
# This file exists because of an nginx rule that is easy to get wrong: `add_header` is
# inherited from an outer block ONLY if the inner block declares no `add_header` of its
# own. Every location here sets its own Cache-Control, so declaring the security headers
# once at server level silently dropped all of them from /index.html, /assets/ and every
# tile. They are included explicitly in each location instead — verified by asserting the
# headers on a served response, not by reading the config.

add_header X-Content-Type-Options "nosniff"    always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "no-referrer" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

# Content-Security-Policy.
#   worker-src / child-src blob:  MapLibre compiles its tile workers from a blob URL
#   img-src blob: + data:         canvas-drawn bus glyphs and inline SVG data URIs
#   style-src 'unsafe-inline'     React sets element style="" attributes
#   *.openstreetmap.org           the OPT-IN "Streets (online)" basemap, which is never
#                                 the default. Remove both entries to hard-lock the
#                                 container to offline-only operation.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://tile.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
